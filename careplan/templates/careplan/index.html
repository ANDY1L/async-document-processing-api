<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Care Plan Generator</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, textarea { width: 100%; padding: 6px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 20px; }
    #result { white-space: pre-wrap; background: #f5f5f5; padding: 16px; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>Care Plan Generator</h1>

  <form id="form">
    <label>Patient First Name <input name="patient_first_name"></label>
    <label>Patient Last Name <input name="patient_last_name"></label>
    <label>Patient MRN <input name="patient_mrn"></label>
    <label>Patient DOB <input name="patient_dob" type="date"></label>
    <label>Referring Provider <input name="provider_name"></label>
    <label>Provider NPI <input name="provider_npi"></label>
    <label>Primary Diagnosis (ICD-10) <input name="primary_diagnosis"></label>
    <label>Additional Diagnoses <input name="additional_diagnoses"></label>
    <label>Medication Name <input name="medication_name"></label>
    <label>Medication History <textarea name="medication_history" rows="3"></textarea></label>
    <label>Patient Records <textarea name="patient_records" rows="8"></textarea></label>
    <button type="submit">Generate Care Plan</button>
  </form>

  <div id="result" hidden></div>

  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));

      result.hidden = false;
      result.textContent = "Generating... (waiting for the LLM, this may take tens of seconds)";

      const resp = await fetch("/api/careplans/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const json = await resp.json();
      result.textContent = json.careplan;
    });
  </script>
</body>
</html>
